name: Publish to Pages

# This repo is the plain static portfolio homepage now -- ne-contracts (the
# only thing here that ever needed tests, linting, a payload build, or an
# Actions cache) split into its own repo on 10 Sep 2026, same as every other
# data project. Nothing left here has a build step; this just stages the
# checkout and deploys it as a Pages artifact.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Stage the site
        run: |
          mkdir -p _site
          rsync -a ./ _site/ --exclude '.git' --exclude '.github' --exclude '_site'
          test -f _site/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
