name: NE Contracts daily scrape

on:
  schedule:
    # Both fire every day; the "only near 10pm Central" gate below makes
    # exactly one of them do anything on any given day. Two entries exist
    # because GitHub Actions cron is UTC-only with no DST awareness.
    - cron: '0 3 * * *'   # 10pm Central during CDT (UTC-5, 03:00 UTC next day)
    - cron: '0 4 * * *'   # 10pm Central during CST (UTC-6, 04:00 UTC next day)
  workflow_dispatch:
    inputs:
      force_publish:
        description: 'Also run the weekly build+guard-rail+publish steps regardless of weekday'
        type: boolean
        default: false

permissions:
  contents: write   # to push the weekly build commit
  actions: write     # for `gh cache delete` cleanup

concurrency:
  group: ne-contracts-daily
  cancel-in-progress: false   # never cancel a run that might be mid-write to data/

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Gate on local Central time / compute weekday
        id: gate
        run: |
          hour=$(TZ=America/Chicago date +%H)
          dow=$(TZ=America/Chicago date +%u)   # 1=Mon ... 7=Sun
          echo "dow=$dow" >> "$GITHUB_OUTPUT"
          if [ "$hour" = "22" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "Local Central hour is $hour, not 22 -- this is the DST-mismatched cron entry for today, skipping (the other entry fires the real run)."
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.proceed == 'true' || github.event_name == 'workflow_dispatch'
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.gate.outputs.proceed == 'true' || github.event_name == 'workflow_dispatch'
        working-directory: ne-contracts
        run: pip install -r requirements.txt

      - name: Restore data/ cache
        if: steps.gate.outputs.proceed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/cache/restore@v4
        with:
          path: ne-contracts/data
          key: ne-contracts-data-${{ github.run_id }}     # never pre-exists -- forces the restore-keys fallback below
          restore-keys: |
            ne-contracts-data-

      - name: Log restored data/ sizes
        if: steps.gate.outputs.proceed == 'true' || github.event_name == 'workflow_dispatch'
        run: ls -la ne-contracts/data/*.csv 2>&1 || echo "no CSVs restored -- scrape.py --daily will refuse to run and fail this job"

      - name: Daily scrape -- contract
        if: steps.gate.outputs.proceed == 'true' || github.event_name == 'workflow_dispatch'
        working-directory: ne-contracts
        run: python3 scripts/scrape.py contract --daily

      - name: Daily scrape -- purchase-order
        if: steps.gate.outputs.proceed == 'true' || github.event_name == 'workflow_dispatch'
        working-directory: ne-contracts
        run: python3 scripts/scrape.py purchase-order --daily

      - name: Daily scrape -- state
        if: steps.gate.outputs.proceed == 'true' || github.event_name == 'workflow_dispatch'
        working-directory: ne-contracts
        run: python3 scripts/scrape.py state --daily

      - name: Save data/ cache
        if: always() && (steps.gate.outputs.proceed == 'true' || github.event_name == 'workflow_dispatch')
        uses: actions/cache/save@v4
        with:
          path: ne-contracts/data
          key: ne-contracts-data-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Delete old data/ cache entries (keep newest 3)
        if: always() && (steps.gate.outputs.proceed == 'true' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --key ne-contracts-data- --json id,createdAt --limit 100 \
            | jq -r 'sort_by(.createdAt) | reverse | .[3:] | .[].id' \
            | xargs -r -n1 gh cache delete

      # --- Weekly publish leg: Sunday only (or workflow_dispatch force_publish) ---

      - name: Check entity list drift
        if: steps.gate.outputs.dow == '7' && (steps.gate.outputs.proceed == 'true' || github.event.inputs.force_publish == 'true')
        working-directory: ne-contracts
        run: python3 scripts/check_entity_drift.py

      - name: Build site
        if: steps.gate.outputs.dow == '7' && (steps.gate.outputs.proceed == 'true' || github.event.inputs.force_publish == 'true')
        working-directory: ne-contracts
        run: python3 scripts/build_site.py

      - name: Guard rail on this week's diff
        if: steps.gate.outputs.dow == '7' && (steps.gate.outputs.proceed == 'true' || github.event.inputs.force_publish == 'true')
        working-directory: ne-contracts
        run: python3 scripts/check_daily_diff.py

      - name: Commit and push the new build
        if: steps.gate.outputs.dow == '7' && (steps.gate.outputs.proceed == 'true' || github.event.inputs.force_publish == 'true')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ne-contracts/d ne-contracts/manifest.json ne-contracts/data/scrape_meta.json
          git diff --cached --quiet || git commit -m "Weekly rebuild: publish the week's daily-scraped changes"
          git push origin main
